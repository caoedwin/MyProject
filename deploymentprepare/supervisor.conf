# ============================================================
# Supervisor 配置 (备选方案, 如果不用 systemd)
# 放置于 /etc/supervisor/conf.d/myproject.conf
# ============================================================

[program:myproject_gunicorn]
command=/usr/local/bin/gunicorn -c /opt/MyProject/deploymentprepare/gunicorn.conf.py config.wsgi
directory=/opt/MyProject
user=www-data
autostart=true
autorestart=true
stdout_logfile=/opt/MyProject/logs/supervisor_gunicorn.log
stderr_logfile=/opt/MyProject/logs/supervisor_gunicorn_err.log

[program:myproject_daphne]
command=/usr/local/bin/daphne -b 127.0.0.1 -p 8001 config.asgi:application
directory=/opt/MyProject
user=www-data
autostart=true
autorestart=true
stdout_logfile=/opt/MyProject/logs/supervisor_daphne.log
stderr_logfile=/opt/MyProject/logs/supervisor_daphne_err.log

[program:myproject_celery]
command=/usr/local/bin/celery -A config.celery_app worker --loglevel=info --concurrency=4
directory=/opt/MyProject
user=www-data
autostart=true
autorestart=true
stdout_logfile=/opt/MyProject/logs/supervisor_celery.log
stderr_logfile=/opt/MyProject/logs/supervisor_celery_err.log

[program:myproject_celery_beat]
command=/usr/local/bin/celery -A config.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/opt/MyProject
user=www-data
autostart=true
autorestart=true
stdout_logfile=/opt/MyProject/logs/supervisor_beat.log
stderr_logfile=/opt/MyProject/logs/supervisor_beat_err.log
