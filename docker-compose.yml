# MySQL 8.4 容器 - 用于 Django 6.1 新项目
# 与本机 MySQL 8.0 完全隔离，使用 3307 端口避免冲突
services:
  mysql84:
    image: docker.m.daocloud.io/library/mysql:8.4
    container_name: myproject_mysql84
    restart: unless-stopped
    ports:
      - "3307:3306"   # 宿主机 3307 -> 容器 3306，避免与本机 3306 冲突
    environment:
      MYSQL_ROOT_PASSWORD: "DCT@2019"
      MYSQL_DATABASE: "myproject"
      MYSQL_USER: "edwin"
      MYSQL_PASSWORD: "DCT@2019"
      TZ: "Asia/Shanghai"
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --mysql-native-password=ON
      --max_connections=200
      --innodb_buffer_pool_size=512M
    volumes:
      - mysql84_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d  # 可放置初始化 SQL
    # 数据持久化到宿主机指定目录（可选，下方 volumes 已声明命名卷）
    # 如需映射到本机目录，替换为：
    # - D:/docker/mysql84/data:/var/lib/mysql

  # 可选：Redis 容器（如果不想用本机 Redis）
  # redis:
  #   image: redis:7-alpine
  #   container_name: myproject_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6380:6379"
  #   command: redis-server --requirepass DCT2019
  #   volumes:
  #     - redis_data:/data

volumes:
  mysql84_data:
    name: myproject_mysql84_data
