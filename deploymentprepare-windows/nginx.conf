# ============================================================
# MyProject 生产环境 Nginx 配置
# 同源部署：前端 Vue SPA + Django API + WebSocket 统一入口
#
# 部署位置: Nginx 安装目录\conf\ (建议命名为 myproject.conf)
# 在 nginx.conf 的 http{} 块中 include 本文件:
#   include C:/path/to/deploymentprepare-windows/nginx.conf;
#
# ============== 部署前必须修改 ==============
# 将下方所有 __DEPLOY_ROOT__ 替换为实际部署根目录，例如：
#   C:/app/MyProject
# 同时修改日志路径中的 LOG_DIR
# =============================================
# ============================================================

# ---------- 后端服务上游 ----------
upstream myproject_django {
    server 127.0.0.1:8000;
    # 如有多个 Django 实例可在此添加，实现负载均衡
    # server 127.0.0.1:8002;
}

# WebSocket (Daphne)
upstream myproject_ws {
    server 127.0.0.1:8001;
}

server {
    listen 80;
    server_name _;  # 修改为实际域名或 IP

    # 如需 HTTPS，取消下面注释并配置证书
    # listen 443 ssl;
    # ssl_certificate     C:/nginx/ssl/myproject.crt;
    # ssl_certificate_key C:/nginx/ssl/myproject.key;

    # 上传文件大小限制
    client_max_body_size 50M;

    # ============ ① API 代理到 Django ============
    # 必须在 location / 之前，因为 Nginx 按最长前缀匹配
    location /api/ {
        proxy_pass http://myproject_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ ② Django Admin 后台 ============
    location /admin/ {
        proxy_pass http://myproject_django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ============ ③ WebSocket 代理 ============
    location /ws/ {
        proxy_pass http://myproject_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;  # 长连接超时（秒）
    }

    # ============ ④ 静态文件（Django collectstatic 产物） ============
    location /static/ {
        alias __DEPLOY_ROOT__/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ============ ⑤ 媒体文件（用户上传） ============
    location /media/ {
        alias __DEPLOY_ROOT__/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ============ ⑥ 前端 SPA（必须放在所有其他 location 之后） ============
    # 使用 root + try_files（非 alias），避免 SPA history 模式刷新 404 的 Nginx 已知陷阱
    location / {
        root __DEPLOY_ROOT__/frontend/dist;
        try_files $uri $uri/ /index.html;
        index index.html;
    }

    # ============ 日志 ============
    access_log __DEPLOY_ROOT__/logs/nginx-access.log;
    error_log  __DEPLOY_ROOT__/logs/nginx-error.log;
}
